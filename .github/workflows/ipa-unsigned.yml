name: IPA Unsigned
# Неподписанный .ipa — ставится через AltStore / SideStore / Sideloadly / Xcode Devices
# Автор: Flenym
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  swiftui-unsigned:
    name: SwiftUI IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version; xcode-select -p

      - name: Install XcodeGen & xcpretty
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Generate Xcode project (ios-native)
        working-directory: ios-native
        run: |
          /opt/homebrew/bin/xcodegen generate --spec project.yml 2>/dev/null || xcodegen generate --spec project.yml
          ls -la
          ls -la DriveMind.xcodeproj 2>/dev/null || true

      - name: Build .app (CODE_SIGNING_ALLOWED=NO)
        working-directory: ios-native
        run: |
          set -x
          xcodebuild -project DriveMind.xcodeproj -scheme DriveMind -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty; code=${PIPESTATUS[0]}; echo "xcodebuild exit $code"; exit $code

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -x
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DriveMind.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "DriveMind.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: DriveMind.app not found"
            find build -name "*.app" 2>/dev/null | head -20 || true
            ls -R build 2>/dev/null | head -60 || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH" | head -20
          rm -rf Payload DriveMind-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DriveMind-unsigned.ipa Payload
          ls -lh DriveMind-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveMind-unsigned-swiftui-ipa
          path: ios-native/DriveMind-unsigned.ipa
          retention-days: 14

  expo-unsigned:
    name: Expo IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version; xcode-select -p

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --non-interactive || npx expo prebuild --platform ios --non-interactive

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build Expo .app (unsigned)
        run: |
          set -x
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -1)
          PROJECT=$(ls -d ios/*.xcodeproj 2>/dev/null | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs 2>/dev/null || xcodebuild -list -project "$PROJECT" 2>/dev/null | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs 2>/dev/null || echo "DRIVEMIND")
          echo "WORKSPACE=$WORKSPACE PROJECT=$PROJECT SCHEME=$SCHEME"
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | head -20 || true
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath ios/build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty; code=${PIPESTATUS[0]}; echo "exit $code"; exit $code
          else
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath ios/build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty; code=${PIPESTATUS[0]}; echo "exit $code"; exit $code
          fi

      - name: Package Expo unsigned IPA
        run: |
          set -x
          APP_PATH="ios/build/DerivedData/Build/Products/Release-iphoneos/DRIVEMIND.app"
          if [ ! -d "$APP_PATH" ]; then APP_PATH=$(find ios/build -name "*.app" -type d | head -1); fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app found"
            find ios/build -name "*.app" 2>/dev/null | head -20 || true
            ls -R ios/build 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH" | head -10
          rm -rf Payload DriveMind-expo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DriveMind-expo-unsigned.ipa Payload
          ls -lh DriveMind-expo-unsigned.ipa

      - name: Upload Expo IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveMind-unsigned-expo-ipa
          path: DriveMind-expo-unsigned.ipa
          retention-days: 14
