name: IPA Unsigned
# Собирает НЕПОДПИСАННЫЙ .ipa (CODE_SIGNING_ALLOWED=NO) — ставится через AltStore/SideStore/Sideloadly/Xcode.
# Автор: Flenym
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  swiftui-unsigned:
    name: SwiftUI IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate Xcode project (ios-native)
        working-directory: ios-native
        run: |
          xcodegen generate --spec project.yml || echo "xcodegen failed, trying fallback"
          ls -la
          cat project.yml | head -20

      - name: Show Xcode version
        run: xcodebuild -version && xcode-select -p

      - name: Build .app (CODE_SIGNING_ALLOWED=NO)
        working-directory: ios-native
        run: |
          set -x
          # Try workspace first, then project
          if [ -f "DriveMind.xcworkspace/contents.xcworkspacedata" ]; then
            xcodebuild -workspace DriveMind.xcworkspace -scheme DriveMind -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty || xcodebuild -workspace DriveMind.xcworkspace -scheme DriveMind -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project DriveMind.xcodeproj -scheme DriveMind -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty || xcodebuild -project DriveMind.xcodeproj -scheme DriveMind -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -x
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DriveMind.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "DriveMind.app" -type d | head -1)
          fi
          # Fallback: search build folder
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "DriveMind.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH" || true
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: DriveMind.app not found"
            find . -name "*.app" | head -20
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -20
            exit 1
          fi
          rm -rf Payload DriveMind-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DriveMind-unsigned.ipa Payload
          ls -lh DriveMind-unsigned.ipa
          echo "IPA created: $(pwd)/DriveMind-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveMind-unsigned-swiftui-ipa
          path: ios-native/DriveMind-unsigned.ipa
          retention-days: 14

  expo-unsigned:
    name: Expo IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --non-interactive || npx expo prebuild --platform ios --non-interactive

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update || pod install

      - name: Build Expo .app (unsigned)
        run: |
          set -x
          # Find workspace/scheme
          WORKSPACE=$(ls ios/*.xcworkspace 2>/dev/null | head -1)
          PROJECT=$(ls ios/*.xcodeproj 2>/dev/null | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace 2>/dev/null || basename "$PROJECT" .xcodeproj 2>/dev/null || echo "DriveMind")
          echo "WORKSPACE=$WORKSPACE PROJECT=$PROJECT SCHEME=$SCHEME"
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty || xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty || xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Package Expo unsigned IPA
        run: |
          set -x
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find ios -name "*.app" -type d | head -1); fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH" || true
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app found"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -20
            find ios -name "*.app" | head -20
            exit 1
          fi
          rm -rf Payload DriveMind-expo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DriveMind-expo-unsigned.ipa Payload
          ls -lh DriveMind-expo-unsigned.ipa

      - name: Upload Expo IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveMind-unsigned-expo-ipa
          path: DriveMind-expo-unsigned.ipa
          retention-days: 14
