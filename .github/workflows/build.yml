name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo-doctor || true

  ios-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: '5.10' }
      - name: Build SwiftUI (simulator, unsigned)
        working-directory: ios-native
        run: |
          xcodebuild -project DriveMind.xcodeproj -scheme DriveMind -destination 'platform=iOS Simulator,name=iPhone 15' build | xcpretty || xcodebuild -list || echo "Need xcodegen: brew install xcodegen && xcodegen generate"
      - name: Tests
        working-directory: ios-native
        run: xcodebuild test -project DriveMind.xcodeproj -scheme DriveMind -destination 'platform=iOS Simulator,name=iPhone 15' || true

  eas-ios:
    if: ${{ secrets.EXPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: [expo-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm i -g eas-cli
      - run: eas build --platform ios --non-interactive --no-wait
        env: { EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} }
